plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sainaw.mm.board'
    compileSdk 34

    defaultConfig {
        applicationId "com.sainaw.mm.board"
        minSdk 21
        targetSdk 34
        versionCode 19
        versionName "5.2.12"
    }

    signingConfigs {
        release {
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}

String signingPath = System.getenv('SAINAW_SIGNING_PROPERTIES')
File signingPropertiesFile = signingPath ? new File(signingPath) : rootProject.file('credentials/release.keystore.properties')
if (signingPropertiesFile.exists()) {
    Properties props = new Properties()
    props.load(new FileInputStream(signingPropertiesFile))
    
    String suppliedKey = System.getenv('SAINAW_KEYSTORE')
    android.signingConfigs.release.storeFile = suppliedKey ? new File(suppliedKey) : rootProject.file('credentials/release.keystore')
    android.signingConfigs.release.storePassword = props['storePassword']
    android.signingConfigs.release.keyAlias = props['keyAlias']
    android.signingConfigs.release.keyPassword = props['keyPassword']
}
